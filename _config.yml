title: A crow's nest # name of the site
author: Gyeongmo Yang # name of site's author
email: kyeongmo31@gmail.com # email of site's author
url: https://blog.yanggyeongmo.com # root address of the site
baseurl: "" # subpath of the site, e.g. "/blog" (leave it blank "" if you're site shouldn't use a subpath)
description: > # description of the site (multiple lines allowed)
  Hi, I'm Gyeongmo Yang, usually called Nathan in workplaces. I've worked as a software engineer since 2019.
  Here's where my thoughts become concrete, public words.
  If you'd like to know more about me, please find me by the links below.

social:
  name: Gyeongmo Yang
  links:
    - https://github.com/yangkyeongmo
    - https://www.linkedin.com/in/gyeongmo-yang-8875671a2/
locale: en_US
timezone: Asia/Seoul

permalink: /:slug.html

favicon: "logo.png" # name+extension of favicon (which must be put on the root folder)
goat_counter: "yangkyeongmo-github-io" # put your GoatCounter name if you want to use GoatCounter analytics
google_analytics: "G-6SEZYF2VSS"

# Styles and layouts are local (GitHub Pages classic). Do not re-enable
# remote_theme or the upstream invert-filter CSS will come back.

theme_config:
  appearance: "auto" # can be "light", "dark" or "auto"
  back_home_text: ".." # customize text for homepage link in post layout
  date_format: "%Y-%m-%d" # customize how date is formatted
  show_description: true # show blog description in home page

sass:
  style: :compressed

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed

# Keep jekyll-feed off feed.xml / feed-ko.xml (those are language-filtered).
feed:
  path: feed-unfiltered.xml

logo: /assets/img/og-default.png

defaults:
  - scope:
      path: ""
    values:
      lang: en
      locale: en_US
      image: /assets/img/og-default.png
  - scope:
      path: ""
      type: posts
    values:
      layout: post

exclude:
  - vendor
  - Gemfile
  - Gemfile.lock
  - Makefile
  - no-style-please.gemspec
  - LICENSE.txt
  - README.md

markdown: kramdown
highlighter: rouge
kramdown:
  auto_ids: true
  auto_id_stripping: true
