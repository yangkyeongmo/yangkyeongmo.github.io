{%- assign lang = page.lang | default: "en" -%}
{%- if lang == "ko" -%}
  {%- assign home_path = "/ko/" -%}
{%- else -%}
  {%- assign home_path = "/" -%}
{%- endif -%}
<header class="site-header">
  <a class="site-title" href="{{ home_path | relative_url }}"{% if page.layout == "home" %} aria-current="page"{% endif %}>{{ site.title }}</a>
  <div class="site-header-end">
    {%- include lang_toggle.html -%}
  </div>
</header>
